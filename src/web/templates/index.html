<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Disease Identifier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background-color: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background-color: #f0f0ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #666;
            margin-bottom: 5px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 12px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
        }
        
        .btn-clear:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .preview {
            margin-bottom: 20px;
            display: none;
        }
        
        .preview img {
            max-width: 100%;
            border-radius: 6px;
            max-height: 300px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .result.success {
            border-left: 4px solid #4caf50;
        }
        
        .result.error {
            border-left: 4px solid #f44336;
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .result-item {
            margin-bottom: 10px;
            color: #666;
        }
        
        .result-label {
            font-weight: 600;
            color: #333;
        }
        
        .result-value {
            color: #667eea;
        }
        
        .confidence {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 5px;
        }
        
        .recommendations {
            background: white;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #ffc107;
        }
        
        .recommendations-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .recommendations-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .error-message {
            color: #f44336;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 AI Crop Disease Identifier</h1>
        <p class="subtitle">Upload a leaf image to identify the crop and detect diseases</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">JPG or PNG, max 10 MB</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png">
        </div>
        
        <div class="preview" id="preview">
            <img id="previewImage" src="" alt="Preview">
        </div>
        
        <div class="button-group">
            <button class="btn-upload" id="uploadBtn">Choose Image</button>
            <button class="btn-clear" id="clearBtn" disabled>Clear</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing image...</p>
        </div>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        
        let selectedFile = null;
        
        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // Upload button click
        uploadBtn.addEventListener('click', () => fileInput.click());
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileSelect(file);
            }
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                handleFileSelect(file);
            }
        });
        
        // Clear button
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            preview.style.display = 'none';
            result.style.display = 'none';
            clearBtn.disabled = true;
            uploadBtn.textContent = 'Choose Image';
        });
        
        function handleFileSelect(file) {
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Update button
            uploadBtn.textContent = 'Analyze Image';
            clearBtn.disabled = false;
            
            // Auto-submit
            submitImage();
        }
        
        function submitImage() {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            loading.style.display = 'block';
            result.style.display = 'none';
            
            fetch('/api/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                displayResult(data);
            })
            .catch(error => {
                loading.style.display = 'none';
                displayError('Error: ' + error.message);
            });
        }
        
        function displayResult(data) {
            result.innerHTML = '';
            result.className = 'result';
            
            if (!data.success) {
                result.classList.add('error');
                result.innerHTML = `
                    <div class="result-title">❌ Error</div>
                    <div class="error-message">${data.error}</div>
                `;
            } else {
                result.classList.add('success');
                let html = '<div class="result-title">✅ Analysis Result</div>';
                
                if (data.crop) {
                    html += `
                        <div class="result-item">
                            <span class="result-label">Crop:</span>
                            <span class="result-value">${data.crop}</span>
                            ${data.crop_confidence ? `<span class="confidence">${(data.crop_confidence * 100).toFixed(1)}%</span>` : ''}
                        </div>
                    `;
                }
                
                if (data.disease) {
                    html += `
                        <div class="result-item">
                            <span class="result-label">Disease:</span>
                            <span class="result-value">${data.disease}</span>
                            ${data.disease_confidence ? `<span class="confidence">${(data.disease_confidence * 100).toFixed(1)}%</span>` : ''}
                        </div>
                    `;
                }
                
                if (data.recommendations) {
                    html += `
                        <div class="recommendations">
                            <div class="recommendations-title">💡 Recommendations</div>
                            <div class="recommendations-text">${data.recommendations}</div>
                        </div>
                    `;
                }
                
                result.innerHTML = html;
            }
            
            result.style.display = 'block';
        }
        
        function displayError(message) {
            result.innerHTML = `
                <div class="result-title">❌ Error</div>
                <div class="error-message">${message}</div>
            `;
            result.className = 'result error';
            result.style.display = 'block';
        }
    </script>
</body>
</html>
